name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.15.0). Leave empty to use the package.json version.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine tag and version
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG}, version=${VERSION}"

  build:
    name: Build VSIX + source zip
    runs-on: ubuntu-latest
    needs: resolve
    outputs:
      vsix: ${{ steps.pack.outputs.vsix }}
      sourcezip: ${{ steps.srczip.outputs.sourcezip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Sync package.json version
        shell: bash
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          TARGET="${{ needs.resolve.outputs.version }}"
          if [ "${CURRENT}" != "${TARGET}" ]; then
            echo "Updating package.json version from ${CURRENT} to ${TARGET}"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = process.env.TARGET;
              if (pkg.symbolicversion !== undefined) { pkg.symbolicversion = process.env.TARGET; }
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n');
            "
          fi
        env:
          TARGET: ${{ needs.resolve.outputs.version }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile TypeScript
        run: npx tsc -p ./

      - name: Typecheck tests
        run: npx tsc -p tsconfig.test.json --noEmit

      - name: Run unit tests
        run: npm test

      - name: Install vsce
        run: npm install --no-save @vscode/vsce

      - name: Package extension
        id: pack
        shell: bash
        run: |
          OUT="galasa-plugin-${{ needs.resolve.outputs.version }}.vsix"
          npx --yes @vscode/vsce package --out "$OUT"
          echo "vsix=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Build source code zip
        id: srczip
        shell: bash
        run: |
          OUT="galasa-plugin-${{ needs.resolve.outputs.version }}-src.zip"
          # Reproducible zip from the committed tree only — excludes node_modules, out/, .git, etc.
          git archive --format=zip -o "$OUT" HEAD
          echo "sourcezip=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Compute checksums
        shell: bash
        run: |
          VSIX="${{ steps.pack.outputs.vsix }}"
          SRC="${{ steps.srczip.outputs.sourcezip }}"
          sha256sum "$VSIX" "$SRC" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ needs.resolve.outputs.version }}
          path: ${{ steps.pack.outputs.vsix }}
          retention-days: 90

      - name: Upload source zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: src-${{ needs.resolve.outputs.version }}
          path: ${{ steps.srczip.outputs.sourcezip }}
          retention-days: 90

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v7
        with:
          name: checksums-${{ needs.resolve.outputs.version }}
          path: SHA256SUMS.txt
          retention-days: 90

  release:
    name: Publish GitHub Release (VSIX + source zip only — no marketplace publish)
    runs-on: ubuntu-latest
    needs: [resolve, build]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: vsix-${{ needs.resolve.outputs.version }}
          path: dist/

      - name: Download source zip
        uses: actions/download-artifact@v8
        with:
          name: src-${{ needs.resolve.outputs.version }}
          path: dist/

      - name: Download checksums
        uses: actions/download-artifact@v8
        with:
          name: checksums-${{ needs.resolve.outputs.version }}
          path: dist/

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          {
            echo "## galasa-plugin ${{ needs.resolve.outputs.tag }}"
            echo ""
            if [ -f CHANGELOG.md ]; then
              echo "See CHANGELOG.md for the full list of changes."
            fi
            echo ""
            echo "### Assets"
            echo "- \`galasa-plugin-${{ needs.resolve.outputs.version }}.vsix\` — installable VSIX"
            echo "- \`galasa-plugin-${{ needs.resolve.outputs.version }}-src.zip\` — source-code archive (\`git archive HEAD\`)"
            echo "- \`SHA256SUMS.txt\` — checksums for both"
            echo ""
            echo "### Install"
            echo "1. Download \`galasa-plugin-${{ needs.resolve.outputs.version }}.vsix\` below."
            echo "2. In VS Code: Extensions panel → ⋮ → Install from VSIX..."
            echo "   Or run: \`code --install-extension galasa-plugin-${{ needs.resolve.outputs.version }}.vsix\`"
            echo ""
            echo "_This release is **not** published to the VS Code Marketplace or Open VSX. Install via the VSIX above._"
          } > RELEASE_NOTES.md
          echo "path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: galasa-plugin ${{ needs.resolve.outputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ inputs.prerelease == true }}
          files: |
            dist/*.vsix
            dist/*-src.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
