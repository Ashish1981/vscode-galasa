name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.15.0). Leave empty to use the package.json version.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false
      publish_marketplace:
        description: 'Publish to VS Code Marketplace (requires VSCE_PAT secret)'
        required: false
        type: boolean
        default: false
      publish_open_vsx:
        description: 'Publish to Open VSX (requires OVSX_PAT secret)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag and version
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG}, version=${VERSION}"

  build:
    name: Build VSIX
    runs-on: ubuntu-latest
    needs: resolve
    outputs:
      vsix: ${{ steps.pack.outputs.vsix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync package.json version
        shell: bash
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          TARGET="${{ needs.resolve.outputs.version }}"
          if [ "${CURRENT}" != "${TARGET}" ]; then
            echo "Updating package.json version from ${CURRENT} to ${TARGET}"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = process.env.TARGET;
              if (pkg.symbolicversion !== undefined) { pkg.symbolicversion = process.env.TARGET; }
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n');
            "
          fi
        env:
          TARGET: ${{ needs.resolve.outputs.version }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile TypeScript
        run: npx tsc -p ./

      - name: Install vsce
        run: npm install --no-save @vscode/vsce

      - name: Package extension
        id: pack
        shell: bash
        run: |
          OUT="galasa-plugin-${{ needs.resolve.outputs.version }}.vsix"
          npx --yes @vscode/vsce package --out "$OUT"
          echo "vsix=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ needs.resolve.outputs.version }}
          path: ${{ steps.pack.outputs.vsix }}
          retention-days: 90

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve, build]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-${{ needs.resolve.outputs.version }}
          path: dist/

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          {
            echo "## galasa-plugin ${{ needs.resolve.outputs.tag }}"
            echo ""
            if [ -f CHANGELOG.md ]; then
              echo "See CHANGELOG.md for the full list of changes."
            fi
            echo ""
            echo "### Install"
            echo "1. Download the .vsix asset below."
            echo "2. In VS Code: Extensions panel → ⋮ → Install from VSIX..."
            echo "   Or run: \`code --install-extension galasa-plugin-${{ needs.resolve.outputs.version }}.vsix\`"
          } > RELEASE_NOTES.md
          echo "path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: galasa-plugin ${{ needs.resolve.outputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ inputs.prerelease == true }}
          files: |
            dist/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-marketplace:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: [resolve, build, release]
    if: ${{ inputs.publish_marketplace == true }}
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-${{ needs.resolve.outputs.version }}
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install vsce
        run: npm install --no-save @vscode/vsce

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "VSCE_PAT secret not configured; skipping Marketplace publish."
            exit 0
          fi
          VSIX="$(ls dist/*.vsix | head -n 1)"
          npx --yes @vscode/vsce publish --packagePath "$VSIX" --pat "$VSCE_PAT"

  publish-open-vsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    needs: [resolve, build, release]
    if: ${{ inputs.publish_open_vsx == true }}
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-${{ needs.resolve.outputs.version }}
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ovsx
        run: npm install --no-save ovsx

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        shell: bash
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "OVSX_PAT secret not configured; skipping Open VSX publish."
            exit 0
          fi
          VSIX="$(ls dist/*.vsix | head -n 1)"
          npx --yes ovsx publish "$VSIX" -p "$OVSX_PAT"
