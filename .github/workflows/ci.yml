name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'bugfix/**'
      - 'claude/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: Run ESLint (non-blocking)
        run: |
          if [ -f node_modules/.bin/eslint ]; then
            node_modules/.bin/eslint "src/**/*.ts" --max-warnings=200 || true
          else
            echo "ESLint not installed, skipping."
          fi

  typecheck:
    name: TypeScript compile
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile production sources
        run: npx tsc -p ./

      - name: Typecheck tests
        run: npx tsc -p tsconfig.test.json --noEmit

      - name: Upload compiled output
        uses: actions/upload-artifact@v7
        with:
          name: tsc-out
          path: out/
          retention-days: 5

  unit-tests:
    name: Unit tests (mocha)
    runs-on: ${{ matrix.os }}
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests (console)
        run: npm test

      - name: Run unit tests (JUnit XML for artifact)
        if: always()
        shell: bash
        run: |
          mkdir -p test-results
          npx mocha --reporter mocha-junit-reporter \
            --reporter-options mochaFile=./test-results/junit-${{ matrix.os }}.xml || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  java-matrix:
    name: Java compatibility (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile TypeScript
        run: npx tsc -p ./

      - name: Verify Java version detection
        shell: bash
        run: |
          mkdir -p tools/vscode-stub
          cat > tools/vscode-stub/package.json <<'EOF'
          { "name": "vscode", "main": "index.js", "version": "0.0.1" }
          EOF
          cat > tools/vscode-stub/index.js <<'EOF'
          module.exports = {
            workspace: { getConfiguration: () => ({ get: () => undefined }) },
            window: {
              showWarningMessage: () => Promise.resolve(undefined),
              showErrorMessage: () => Promise.resolve(undefined),
              showInformationMessage: () => Promise.resolve(undefined),
            },
            commands: { executeCommand: () => Promise.resolve(undefined) },
          };
          EOF
          cp -r tools/vscode-stub node_modules/vscode || true
          node -e "
          const { detectJava, isVersionSupported, parseJavaVersion } = require('./out/utils/JavaVersion');
          const installation = detectJava();
          if (!installation) { console.error('No Java detected'); process.exit(1); }
          console.log('Detected Java', installation.majorVersion, 'from', installation.source);
          if (!isVersionSupported(installation.majorVersion)) { console.error('Unsupported version'); process.exit(1); }
          const samples = [
            ['java version \"1.8.0_322\"', 8],
            ['openjdk version \"11.0.18\" 2023-01-17', 11],
            ['openjdk version \"17.0.9\" 2023-10-17', 17],
            ['openjdk version \"21.0.1\" 2023-10-17', 21],
            ['openjdk version \"26-ea\" 2026-09-01', 26]
          ];
          for (const [s, exp] of samples) {
            const got = parseJavaVersion(s);
            if (got !== exp) { console.error('Mismatch', s, got); process.exit(1); }
          }
          console.log('All sample versions parsed correctly');
          "

  package:
    name: Package VSIX + source zip
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests, java-matrix]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install vsce
        run: npm install --no-save @vscode/vsce

      - name: Compile TypeScript
        run: npx tsc -p ./

      - name: Compute build identity
        id: buildid
        shell: bash
        run: |
          BASE="$(node -p "require('./package.json').version")"
          SHA7="$(git rev-parse --short=7 HEAD)"
          STAMP="${BASE}-build.${{ github.run_number }}-${SHA7}"
          echo "version=${BASE}"          >> "$GITHUB_OUTPUT"
          echo "stamp=${STAMP}"           >> "$GITHUB_OUTPUT"
          echo "Stamp: ${STAMP}"

      - name: Package extension (VSIX)
        id: pack
        shell: bash
        run: |
          OUT="galasa-plugin-${{ steps.buildid.outputs.stamp }}.vsix"
          npx --yes @vscode/vsce package --out "$OUT"
          ls -lh "$OUT"
          echo "vsix=$OUT" >> "$GITHUB_OUTPUT"

      - name: Build source code zip
        id: srczip
        shell: bash
        run: |
          OUT="galasa-plugin-${{ steps.buildid.outputs.stamp }}-src.zip"
          git archive --format=zip -o "$OUT" HEAD
          ls -lh "$OUT"
          echo "sourcezip=$OUT" >> "$GITHUB_OUTPUT"

      - name: Compute checksums
        shell: bash
        run: |
          sha256sum "${{ steps.pack.outputs.vsix }}" "${{ steps.srczip.outputs.sourcezip }}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ steps.buildid.outputs.stamp }}
          path: ${{ steps.pack.outputs.vsix }}
          retention-days: 30

      - name: Upload source zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: src-${{ steps.buildid.outputs.stamp }}
          path: ${{ steps.srczip.outputs.sourcezip }}
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: checksums-${{ steps.buildid.outputs.stamp }}
          path: SHA256SUMS.txt
          retention-days: 30
